version: 1.3.0
scope: Repository review rules, not certification controls.

rules:
  - id: TOOL-001
    title: Configure and access MCP through Foundry Toolbox
    level: recommendation
    rationale: Foundry Toolbox centralizes MCP configuration, authentication, credential handling, and policy enforcement while allowing tools to be updated without changing hosted-agent code.
    guidance:
      - title: "Agent Framework Foundry Toolbox sample"
        link: "https://github.com/microsoft-foundry/foundry-samples/tree/main/samples/python/hosted-agents/agent-framework/responses/04-foundry-toolbox"
      - title: "LangGraph Foundry Toolbox sample"
        link: "https://github.com/microsoft-foundry/foundry-samples/tree/main/samples/python/hosted-agents/langgraph/responses/02-langgraph-toolbox"
    when: Apply when the hosted agent uses an MCP server; otherwise skip.
    checks: >-
      Inspect deployed code and configuration to determine whether every MCP connection uses Foundry Toolbox instead of the original MCP server. Evidence can include a local azure.ai.toolbox service, a Foundry Toolbox URL such as /toolboxes/{name}/mcp or /toolboxes/{name}/versions/{version}/mcp, a TOOLBOX-named environment variable connected to the MCP path, or a supported Toolbox SDK or constructor. These examples are not exhaustive; accept any clear repository evidence of Toolbox use.
    statusCriteria:
      pass: Every deployed MCP connection clearly uses Foundry Toolbox.
      fail: A deployed MCP connection clearly accesses an original MCP server directly or configures it outside Toolbox.
      inconclusive: MCP use is evident, but repository evidence cannot determine whether every connection uses Toolbox.

  - id: AIGW-001
    title: Use AI Gateway for required rate limits
    level: recommendation
    rationale: Azure API Management AI Gateway can enforce model token or request limits and tool-call limits before traffic reaches backends.
    guidance:
      - title: "APIM hosted-agent solution template"
        link: "https://github.com/microsoft/Foundry-Agent-Solution-Templates/tree/main/apim-hosted-agent"
    when: Apply when repository requirements or configuration specify a model token or request limit or a tool-call rate limit; otherwise skip.
    checks: >-
      1) Establish a model token, model request, or tool-call rate-limit requirement from repository requirements, configuration, or infrastructure; do not infer one from generic retry or 429 handling. 2) For each affected model or tool call path, trace its runtime endpoint through code, configuration, environment variables, and fallbacks. 3) Verify the endpoint belongs to Azure API Management through an azure-api.net hostname, a linked APIM resource, or infrastructure that maps its custom domain to APIM. Local APIM rate-limit policies are supporting evidence, not required evidence, because policies may be managed externally.
    statusCriteria:
      pass: Every required rate-limited path is resolved and uses an APIM AI Gateway endpoint.
      fail: A fully resolved path with a rate-limit requirement calls its model or tool backend directly.
      inconclusive: A rate-limit requirement exists, but the call endpoint or its APIM identity cannot be resolved.

  - id: OBS-001
    title: Enable supported tracing for hosted agents
    level: recommendation
    rationale: Foundry tracing provides end-to-end visibility into agent invocations, model operations, and tool calls. Hosted-agent protocol libraries can emit OpenTelemetry automatically when project monitoring or an OTLP exporter is configured, so explicit application instrumentation is not always required.
    guidance:
      - title: "Configure hosted-agent telemetry"
        link: "https://learn.microsoft.com/azure/foundry/agents/how-to/configure-hosted-agent-telemetry"
      - title: "Set up tracing for agents"
        link: "https://learn.microsoft.com/azure/foundry/observability/how-to/trace-agent-setup"
    when: Apply to every hosted agent configured with host azure.ai.agent.
    checks: >-
      Inspect azure.yaml, agent configuration, infrastructure, dependencies, and observability documentation. Accept any supported tracing path with an export destination: Foundry project monitoring connected to Application Insights, automatic instrumentation supplied by the hosted-agent library or a framework supported by the Microsoft OpenTelemetry distribution and configured for Application Insights or OTLP export, or explicit OpenTelemetry instrumentation with a configured exporter. Do not require application OpenTelemetry code when the hosted-agent protocol library or Foundry server-side tracing supplies it. Do not treat use of a hosting or instrumentation library alone as proof that telemetry is exported. Treat project-level monitoring that cannot be inspected from the repository as missing evidence, not as proof that tracing is disabled.
    statusCriteria:
      pass: Repository evidence identifies both a supported tracing path and an Application Insights or OTLP export destination, and the configuration does not contradict or disable that path.
      fail: Repository evidence explicitly disables all applicable tracing or telemetry export without documenting an alternative, or claims tracing is enabled while its repository-managed configuration is contradictory.
      inconclusive: Tracing may be supplied by remotely managed Foundry project monitoring or another external configuration that cannot be established from repository evidence.

  - id: SDK-001
    title: Use consistent Microsoft Agent Framework dependencies
    level: recommendation
    rationale: Microsoft Agent Framework is the recommended orchestration framework for applicable Foundry hosted-agent scenarios, but other supported frameworks and custom implementations remain valid choices. This rule checks repository-level dependency consistency rather than requiring the latest package or proving complete runtime compatibility.
    guidance:
      - title: "Microsoft Agent Framework SDK overview"
        link: "https://learn.microsoft.com/azure/foundry/how-to/develop/sdk-overview#agent-framework"
      - title: "Choose a hosted-agent framework"
        link: "https://learn.microsoft.com/azure/foundry/agents/quickstarts/quickstart-deploy-own-code#choose-your-framework"
    when: Apply only when the hosted agent declares or imports Microsoft Agent Framework; otherwise skip this rule.
    checks: >-
      Inspect dependency manifests, lock files, central package-management files, and Microsoft Agent Framework imports under the agent root. Verify that the project declares the official Agent Framework package family and that package declarations, effective versions when determinable, and source imports are internally consistent. An exact declaration or fully resolvable central version declaration can establish the effective direct dependency version. Do not execute tests, inspect dependency caches or generated results, infer API availability from an uninstalled package, or require the latest package version.
    statusCriteria:
      pass: The official Agent Framework package family is declared, the effective direct dependency version can be determined from repository configuration, and source imports are consistent with that package family.
      fail: Repository evidence explicitly shows an unrelated package presented as Agent Framework, conflicting effective dependency versions for the deployed agent, or imports inconsistent with the declared package family.
      inconclusive: The effective package or version is affected by unresolved ranges, unresolved central version management, environment-specific resolution, or other indirection, or imports cannot be mapped reliably to the declared package family.

  - id: SDK-002
    title: Use recommended Foundry hosted-agent SDKs
    level: recommendation
    rationale: Approved Foundry hosting packages reduce custom protocol code.
    guidance:
      - title: "Python hosted-agent framework samples"
        link: "https://github.com/microsoft-foundry/foundry-samples/tree/main/samples/python/hosted-agents"
      - title: ".NET hosted-agent framework samples"
        link: "https://github.com/microsoft-foundry/foundry-samples/tree/main/samples/csharp/hosted-agents"
      - title: "Python LangGraph hosting samples"
        link: "https://github.com/microsoft-foundry/foundry-samples/tree/main/samples/python/hosted-agents/langgraph"
    when: Apply to every hosted agent configured with host azure.ai.agent.
    checks: >-
      Inspect deployed dependency manifests and lock files only. Require at least one approved hosting dependency: Python agent-framework-foundry-hosting, langchain-azure-ai[hosting] (or resolved lock equivalent), or azure-ai-agentserver-invocations; C# Microsoft.Agents.AI.Foundry.Hosting or Azure.AI.AgentServer.Invocations. Generic web framework dependencies alone do not qualify. Do not inspect source code or protocol wiring.
    statusCriteria:
      pass: An approved hosting dependency is resolved and no unapproved agent or hosting SDK is declared.
      fail: No approved hosting dependency is declared, or dependencies include Python openai-agents or another unapproved agent or hosting SDK.
      inconclusive: Dependency files cannot be resolved enough to classify.

  - id: AGT-001
    title: Do not instruct agents to bypass controls or fabricate success
    level: warning
    rationale: Operative agent instructions must not authorize fabricated outcomes, unrestricted consequential actions, or bypasses of runtime controls and required approvals.
    guidance:
      - title: "Tool best practices for agents"
        link: "https://learn.microsoft.com/azure/foundry/agents/concepts/tool-best-practice"
      - title: "Responsible AI transparency note for agents"
        link: "https://learn.microsoft.com/azure/foundry/responsible-ai/agents/transparency-note"
    when: Apply when the repository stores or references instructions that govern the hosted agent at runtime; otherwise skip this rule.
    checks: >-
      Identify instructions that are actually loaded or referenced by the hosted agent, distinguishing them from documentation, comments, tests, examples, and security counterexamples. Inspect the operative instructions for language that requires or permits the agent to fabricate results, represent failed operations as successful, bypass authorization or approval controls, or perform unrestricted consequential actions. Do not treat ordinary error recovery, retries, fallback behavior, or clearly bounded automation as a violation.
    statusCriteria:
      pass: Operative instructions do not require or permit fabrication, control or approval bypass, treating failure as success, or unrestricted consequential action.
      fail: Operative instructions explicitly require or permit at least one of those behaviors.
      inconclusive: Potentially unsafe wording is ambiguous, or repository evidence cannot establish whether the identified instructions are operative.

  - id: AUTH-001
    title: Use Microsoft Entra authentication for Azure AI Search
    level: recommendation
    rationale: Microsoft Entra authentication avoids distributing Search API keys and supports identity-based access control for hosted-agent retrieval.
    guidance:
      - title: "Azure AI Search role-based access control"
        link: "https://learn.microsoft.com/azure/search/search-security-rbac"
      - title: "Enterprise knowledge-agent connection configuration"
        link: "https://github.com/microsoft/Foundry-Agent-Solution-Templates/blob/main/enterprise-knowledge-agent/scripts/provision.py"
    when: >-
      Apply only when active hosted-agent code or a linked tool, knowledge source, or connection establishes an Azure AI Search access path. Skip when no such path exists, including inactive examples and generic APIs with no evidence of a Search backend. If a relevant reference cannot be resolved enough to establish applicability, report inconclusive without assuming a Search backend.
    checks: >-
      Trace authentication on each established agent-to-Search access path, including the downstream Search connection when the agent uses Toolbox or a proxy. Accept Microsoft Entra token credentials or an explicitly configured Entra-based connection; do not require a particular credential class. Identify API-key authentication from the actual credential, api-key header, or connection authentication type, including keys loaded from environment variables or Key Vault. A Search SDK import, absence of a key literal, Entra authentication to Toolbox alone, or authentication used only by a provisioning script does not prove the runtime Search path is keyless. Do not require an index schema or index YAML file, inspect secret values, or query Azure.
    statusCriteria:
      pass: Every established runtime Search access path resolves to Microsoft Entra authentication with no API-key fallback.
      fail: Any established runtime Search access path explicitly uses API-key authentication or contains an active API-key fallback. A proven violation takes precedence over unresolved authentication on other paths.
      inconclusive: No API-key violation is proven, but a relevant access reference or its downstream authentication cannot be resolved from repository evidence.

  - id: IMG-001
    title: Pin prebuilt hosted-agent images by digest
    level: recommendation
    rationale: An immutable image digest makes hosted-agent deployments reproducible and prevents a mutable tag from silently selecting different image contents.
    guidance:
      - title: "Azure Container Registry image tagging and versioning"
        link: "https://learn.microsoft.com/azure/container-registry/container-registry-image-tag-version"
      - title: "Private-network hosted-agent existing ACR scenario"
        link: "https://github.com/microsoft/Foundry-Agent-Solution-Templates/tree/main/private-network-hosted-agent/scenarios/existing-private-acr"
    when: >-
      Apply only when the selected hosted-agent service deploys a prebuilt container image supplied through its active deployment configuration. Skip source-code or remote-build deployments that do not consume a prebuilt image. Do not apply this rule to Dockerfile base images or inactive image examples. If the deployment mode cannot be resolved, report inconclusive without assuming an image deployment.
    checks: >-
      Establish the deployment entry point from caller input or an unambiguous active repository configuration, and name it in the result. Resolve the final prebuilt image reference through that entry point, the selected service, and configuration. Verify that deployment uses an immutable digest such as @sha256:<64 hexadecimal characters>. Accept a tag resolved to a digest before deployment if the resolved digest is the value actually submitted. A tag that looks like a version or commit is still mutable. An enforced gate can establish pass only if the selected entry point rejects non-digest references before deploying the same validated value. The possibility of manually bypassing that entry point does not invalidate this scoped pass. An unresolved environment placeholder, documentation showing a digest, or a standalone validator not enforced on the selected path is insufficient evidence. When multiple deployment entry points remain unresolved, do not assume the guarded path is selected; a literal digest shared by all relevant paths can still establish pinning. Do not pull images or query a registry.
    statusCriteria:
      pass: The final submitted image is digest-pinned, or the selected deployment entry point enforces a gate guaranteeing that the same submitted value is digest-pinned. State which entry point this result covers.
      fail: The fully resolved selected deployment path submits a prebuilt image using only a mutable tag or an implicit latest tag.
      inconclusive: The deployment mode or final image cannot be resolved, or pinning depends on an unresolved entry-point choice, digest transformation, or gate enforcement.

  - id: NET-001
    title: Preserve private-only access in repository-managed recovery
    level: warning
    rationale: Automatically opening public access or sending private workload data to a public fallback during recovery defeats an explicitly configured private-only access boundary.
    guidance:
      - title: "Foundry hosted-agent virtual networks"
        link: "https://learn.microsoft.com/azure/foundry/agents/how-to/virtual-networks"
      - title: "Private-network hosted-agent security boundaries"
        link: "https://github.com/microsoft/Foundry-Agent-Solution-Templates/blob/main/private-network-hosted-agent/docs/security.md"
    when: >-
      Apply only when active configuration or an explicit repository contract establishes private-only access for a resource on the selected agent's data path, such as publicNetworkAccess=Disabled. Skip public deployments and resources that merely have a Private Endpoint alongside permitted public access. A template name containing private or network is not sufficient. If the effective access boundary is unresolved, report inconclusive without assuming private-only access.
    checks: >-
      Identify each established private-only data resource and the repository-visible runtime error handlers, deployment scripts, and retry or recovery paths associated with it. Name the inspected paths and excluded external components in the result. Verify that these paths do not automatically enable public access or resend the protected workload data to a public alternative after a connection or deployment failure. Fail only on a reachable, explicit recovery action that breaks the established boundary; a proven violation takes precedence over unresolved paths. Inspect locally referenced recovery helpers when available. An unresolved helper invoked by an inspected path prevents a complete assessment of that path. Unavailable external image internals alone do not invalidate an assessment of resolved repository-managed deployment recovery; explicitly exclude those internals from the result. Retrying the same endpoint, approved operator access through VPN or private routing, identity and management-plane endpoints, and documented platform-required trusted-service exceptions are not public data-path fallbacks. A public DNS hostname alone does not establish public routing. Do not require a particular firewall, DNS layout, or recovery script, and do not query Azure or test connectivity. A scoped pass does not establish the absence of fallback in external components or attest to deployed network isolation.
    statusCriteria:
      pass: The private-only boundary and the inspected repository-managed paths are resolved, and those paths preserve the boundary or stop with an error. Resolved paths without recovery logic also qualify. State the inspected paths and any excluded external components.
      fail: A reachable repository-managed recovery path automatically opens public access for an established private-only resource or redirects its protected workload data to a public alternative.
      inconclusive: No violation is proven, but the private-only boundary is unresolved, no associated repository-visible path is available to inspect, or an inspected path invokes a recovery helper whose behavior cannot be resolved.

  - id: CFG-001
    title: Do not override platform-managed runtime configuration
    level: warning
    rationale: Foundry injects platform-managed runtime values into hosted agents. Redefining reserved FOUNDRY_* or AGENT_* variables can shadow those values and break authentication, routing, telemetry, or agent lifecycle behavior.
    guidance:
      - title: "Review platform environment variables"
        link: "https://learn.microsoft.com/azure/foundry/agents/how-to/configure-hosted-agent-env-variables#review-platform-environment-variables"
    when: Apply when hosted-agent runtime or deployment configuration is present.
    checks: >-
      Inspect azure.yaml, agent configuration, container configuration, deployment scripts, and source code that writes environment variables for the deployed process. Verify that FOUNDRY_* and AGENT_* values supplied by the platform are consumed but are not declared, assigned, or overwritten by repository-managed deployed runtime configuration. Include deprecated user-defined variables such as FOUNDRY_TOOLBOX_ENDPOINT. Reading a platform-managed variable is valid. Do not fail a local-only development environment file unless repository evidence shows that it is committed as deployed configuration or consumed by the deployed runtime. Do not use this rule for general required-setting validation, credentials, endpoint literals, or other configuration without a reserved prefix.
    statusCriteria:
      pass: Repository-managed deployed runtime configuration does not declare, assign, or overwrite FOUNDRY_* or AGENT_* variables; any local-only development values are not consumed by the deployed runtime.
      fail: Repository evidence explicitly declares, assigns, or overwrites a reserved FOUNDRY_* or AGENT_* variable in deployed hosted-agent runtime configuration.
      inconclusive: Repository evidence cannot establish whether a local or externally generated configuration is consumed by the deployed runtime or could shadow a platform-managed value.

  - id: PROTO-001
    title: Keep declared protocols consistent with runtime handlers
    level: warning
    rationale: A Foundry hosted agent must implement each protocol endpoint declared by its deployment configuration. A mismatch prevents the platform from invoking the agent through that protocol.
    guidance:
      - title: "Hosted-agent protocol endpoints"
        link: "https://learn.microsoft.com/azure/foundry/agents/concepts/hosted-agent-contract#protocol-endpoints"
      - title: "Add a protocol adapter"
        link: "https://learn.microsoft.com/azure/foundry/agents/how-to/add-protocol-adapter"
    when: Apply when the hosted-agent service declares the Responses or Invocations protocol in azure.yaml; otherwise skip this rule.
    checks: >-
      Inspect the target azure.ai.agent service, its locally resolvable configuration references, dependency declarations, and deployed entry point. For each Responses or Invocations value in that service's azure.yaml protocols[].protocol, verify that the deployed entry point provides the matching endpoint and handler through an official protocol adapter or a valid custom implementation. When the project declares a specific hosted-agent protocol SDK, verify that the entry point uses that SDK's corresponding adapter or host, while accepting other documented registration patterns. Consistent examples include responses with ResponsesHostServer, ResponsesAgentServerHost, or a custom POST /responses handler, and invocations with InvocationsHostServer, InvocationAgentServerHost, or a custom POST /invocations handler; these examples are not an exhaustive class-name allowlist. Inspect only these two protocols and runtime paths that can be fully resolved from files under the agent root. Do not execute the server or infer dynamically registered routes. Failure to locate or resolve an adapter, route, or handler is inconclusive, not fail.
    statusCriteria:
      pass: Every declared Responses or Invocations protocol has either a statically identifiable official adapter and handler or a statically identifiable custom endpoint and handler, with no explicit protocol mismatch.
      fail: Repository evidence fully resolves the deployed entry point and explicitly shows that a declared Responses or Invocations protocol is mapped to a different endpoint or handler, or that the complete static route registration omits the declared protocol endpoint.
      inconclusive: An adapter, route, handler, deployed entry point, local configuration reference, framework registration, or dynamically constructed route cannot be resolved sufficiently to map every declared Responses or Invocations protocol to a valid implementation path.
