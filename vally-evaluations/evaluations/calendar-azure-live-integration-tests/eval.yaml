name: calendar-azure-live-integration-tests
description: Evaluate whether the Terra-generated observable Daymark application works correctly with its real Azure backing services.
version: "1.0"
type: capability

scoring:
  weights: {}
  threshold: 0.8

defaults:
  runs: 1
  timeout: 75m
  model: gpt-5.6-terra
  judge_model: claude-sonnet-4.6

stimuli:
  - name: verify-daymark-with-live-azure-services
    tags:
      fixture: calendar-azure-observability-open-ended-gpt-5.6-terra
      priority: p0
      service: azure-live-integration
      scope: live
    artifacts:
      include:
        - src/**/*.ts
        - src/**/*.tsx
        - src/**/*.css
        - server/**/*.ts
        - tests/**/*
        - scripts/**/*
        - test-results/**/*
        - package.json
        - package-lock.json
        - tsconfig*.json
        - vite.config.ts
        - README.md
        - .env.example
        - .gitignore
      exclude:
        - node_modules/**
        - dist/**
        - dist-server/**
        - coverage/**
        - .azure/**
        - .env
    turns:
      - |
        Verify that the existing Daymark application code works correctly when
        connected to the real Azure services it already integrates with.

        Provision the minimum disposable Azure resources required for verification,
        run Daymark locally against those resources, and add and execute automated
        live integration tests. Use the currently authenticated Azure context. Both
        successful resource provisioning and successful live application tests are
        required outcomes of this evaluation.

        Keep Daymark running locally throughout verification. Use focused setup and
        cleanup automation for the disposable test resources.

        Requirements:
        1. Preserve the intended calendar, Azure Blob Storage, and Azure Monitor
           Application Insights OpenTelemetry behavior. Diagnose and correct
           application or test defects that prevent successful live verification.
        2. Add a repeatable test-resource setup script that creates a uniquely named
           disposable resource group containing the private Blob Storage container,
           Application Insights resource, required Log Analytics workspace, and only
           the other Azure backing resources the existing code needs. Do not reuse
           or modify existing resources.
        3. Supply resource configuration to the locally running Node.js server at
           runtime. Never commit or print credentials, storage connection strings,
           SAS tokens, or other secrets.
        4. Add a distinct `npm run test:live-azure` entry point that starts or
           targets the locally running application with Azure persistence enabled.
           The test must create a uniquely identifiable appointment through the
           Daymark API, read it back, and independently verify that the expected JSON
           and content type are present in the provisioned private Blob rather than
           the local file fallback.
        5. Generate application activity through the live test and query the
           provisioned Application Insights data, using bounded retries for ingestion
           delay. Verify that Daymark request telemetry and Blob read/write telemetry
           were exported and can be correlated to the tested operation.
        6. Initialize Azure Monitor before application libraries that produce
           telemetry, keep OpenTelemetry API package versions compatible, and
           explicitly flush or shut down telemetry before beginning the final
           ingestion query.
        7. If a correlation query returns no matching rows, enable Azure Monitor
           exporter self-diagnostics and run a bounded, time-filtered discovery query
           for recent telemetry before applying the correlation filter. Use projected
           columns and a row limit. Distinguish exporter failure, ingestion delay,
           schema or attribute mapping, and correlation failure before changing the
           test or reporting a blocker.
        8. Live tests must fail clearly when Azure authentication, resource
           configuration, Blob persistence, telemetry ingestion, or an assertion is
           unavailable. They must not silently skip, use mocked Azure clients, or
           substitute local backing services.
        9. Always write `test-results/live-azure-result.json`, including after a
           failed assertion. Use a `values` object containing the Boolean and numeric
           metrics required by the evaluation graders, plus concise non-secret
           evidence containing Azure resource IDs, assertion outcomes, the
           correlation marker, telemetry names and row counts, and cleanup status.
           The required Boolean keys are `resource_group_created`,
           `storage_account_created`, `private_blob_container_created`,
           `log_analytics_workspace_created`, `application_insights_created`,
           `api_round_trip_passed`, `blob_json_passed`,
           `blob_content_type_passed`, `local_server_stopped`, and
           `resource_group_deleted`. The required numeric row-count keys are
           `calendar_request_telemetry_rows`, `blob_read_telemetry_rows`, and
           `blob_write_telemetry_rows`.
        10. Print concise non-secret Azure resource creation evidence after setup and
            a concise final assertion and cleanup summary after the resource group is
            deleted. Resource IDs and provisioning states are evidence; credentials,
            keys, connection strings, tokens, and complete environment dumps are not.
        11. Keep test data isolated, use bounded waits, terminate the local server,
            and delete the disposable resource group after recording the test result.
            Also clean up after failures so no billable resources are left behind.
        12. Document the live-test prerequisites, command, expected assertions,
            troubleshooting, evidence artifact, and cleanup.
        13. Run the existing unit tests, complete TypeScript build, and lint in
            addition to the live-Azure integration tests.

        If an external Azure precondition prevents progress, preserve the diagnostic
        evidence and report the exact observed condition without fabricating success.
        A failed live test remains unfinished work and does not satisfy this task.
      - |
        Review the implementation and all execution evidence from the previous turn.
        Treat any failed or missing required assertion as unfinished work.

        If the live-Azure test did not pass, diagnose the failure, correct the
        application, telemetry setup, query, or test automation as appropriate, and
        rerun it. A single bounded telemetry-ingestion window with zero correlated
        rows is not by itself evidence of an external Azure blocker: inspect exporter
        self-diagnostics and bounded recent unfiltered telemetry first. Do not weaken,
        remove, mock, or silently skip any required assertion.

        Finish by running `npm run test:live-azure`, the unit tests, the complete
        TypeScript build, and lint. Confirm that
        `test-results/live-azure-result.json` contains the final non-secret evidence
        and all required metrics, that the local server has stopped, and that the
        disposable resource group has been deleted. Report completion only when the
        required checks actually passed; otherwise report the exact evidenced
        external precondition and leave every metric truthful.
    rubric:
      - The work provisions the required disposable Azure backing resources and exercises Daymark from a local process.
      - A repeatable test-resource setup creates a unique disposable resource group, private Blob Storage container, Application Insights resource, and required Log Analytics workspace.
      - The recorded trajectory and live-Azure result artifact contain authentic, consistent Azure command evidence proving that every required backing resource was successfully provisioned; plans, scripts, or documentation without successful execution do not satisfy provisioning.
      - Daymark runs locally with Azure configuration supplied only at runtime, uses the provisioned Blob rather than local JSON fallback, and exposes no credentials or privileged configuration to the browser, repository, or test logs.
      - A distinct automated live test exercises the local Daymark API, round-trips a uniquely identifiable appointment, and independently verifies the stored Azure Blob JSON and content type.
      - The live test generates a unique correlation marker and queries Application Insights with bounded ingestion retries to verify queryable Daymark request and Blob-operation telemetry from that operation.
      - The live test uses real Azure services rather than mocks or local substitutes, fails instead of skipping when prerequisites or assertions are missing, and uses bounded process and polling timeouts.
      - The live-Azure command exits successfully and its recorded result metrics demonstrate that all Azure-backed assertions actually passed; an honestly reported external blocker remains an incomplete result.
      - Test processes and data are isolated, the local server is stopped, disposable Azure resources are deleted after success or failure, and no secrets are persisted or printed.
      - Existing unit tests, the complete TypeScript production build, and lint continue to succeed.
    graders:
      - type: run-command
        name: Unit tests
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/run-npm.mjs
            - test
          timeout: 5m
      - type: run-command
        name: Complete TypeScript production build
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/run-npm.mjs
            - run
            - build
          timeout: 5m
      - type: run-command
        name: Lint
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/run-npm.mjs
            - run
            - lint
          timeout: 5m
      - type: run-command
        name: Live Azure integration
        weight: 3
        config:
          command: node
          args:
            - .vally/tools/run-npm.mjs
            - run
            - test:live-azure
          timeout: 20m
      - type: custom-metrics
        name: Live Azure required outcomes
        weight: 3
        config:
          path: test-results/live-azure-result.json
          assertions:
            - metric: resource_group_created
              equals: true
            - metric: storage_account_created
              equals: true
            - metric: private_blob_container_created
              equals: true
            - metric: log_analytics_workspace_created
              equals: true
            - metric: application_insights_created
              equals: true
            - metric: api_round_trip_passed
              equals: true
            - metric: blob_json_passed
              equals: true
            - metric: blob_content_type_passed
              equals: true
            - metric: calendar_request_telemetry_rows
              min: 1
            - metric: blob_read_telemetry_rows
              min: 1
            - metric: blob_write_telemetry_rows
              min: 1
            - metric: local_server_stopped
              equals: true
            - metric: resource_group_deleted
              equals: true
      - type: prompt
        name: Live Azure evidence authenticity
        weight: 3
        config:
          prompt: |
            Evaluate the authenticity and consistency of the complete live-Azure
            verification. Cross-check the final repository, live-Azure result
            artifact, and recorded trajectory. Require credible successful resource
            creation outputs and identifiers, local API and independent Blob
            assertions, correlated query results for Daymark request and Blob
            read/write telemetry, successful rerun evidence, local-server shutdown,
            and resource-group deletion. The metrics artifact alone is not proof:
            its values must agree with the implementation and execution evidence.
            Reject mocks, local substitutes, silent skips, weakened assertions,
            fabricated or documentation-only success, leaked secrets, unbounded
            polling, or resources left running. Score 5 only when every rubric
            criterion is demonstrably satisfied.
          scoring: scale_1_5
          evidence:
            - trajectory
            - repo

environment:
  commands:
    - npm ci --no-audit --no-fund --prefer-offline
  commandTimeout: 15m
  skills: []
  files:
    - src: ../../tools/run-npm.mjs
      dest: .vally/tools/run-npm.mjs
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/src
      dest: src
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/server
      dest: server
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/index.html
      dest: index.html
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/package.json
      dest: package.json
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/package-lock.json
      dest: package-lock.json
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/tsconfig.json
      dest: tsconfig.json
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/tsconfig.app.json
      dest: tsconfig.app.json
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/tsconfig.node.json
      dest: tsconfig.node.json
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/tsconfig.server.json
      dest: tsconfig.server.json
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/vite.config.ts
      dest: vite.config.ts
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/.oxlintrc.json
      dest: .oxlintrc.json
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/.gitignore
      dest: .gitignore
    - src: ../../fixtures/calendar-azure-observability-open-ended-gpt-5.6-terra/README.md
      dest: README.md
