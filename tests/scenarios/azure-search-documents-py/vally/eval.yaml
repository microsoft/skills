name: azure-search-documents-py-eval
description: Vally evaluation suite for azure-search-documents-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  judge_model: gpt-5.5
stimuli:
  - name: basic_client_setup
    prompt: |-
      Create a basic Azure AI Search client using SearchClient with proper
      authentication. Include connecting to an existing search index and
      executing a simple search query.
      Save the code to a file named `basic_client_setup.py` in the workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-search-documents-py
  - name: vector_search_basic
    prompt: |-
      Create a vector search example using Azure AI Search.
      Generate embeddings for a query and search using VectorizedQuery.
      Include proper vector configuration and search parameters.
      Save the code to a file named `vector_search_basic.py` in the workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-search-documents-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-search-documents-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
