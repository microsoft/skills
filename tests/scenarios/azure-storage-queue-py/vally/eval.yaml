name: azure-storage-queue-py-eval
description: Vally evaluation suite for azure-storage-queue-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  judge_model: gpt-5.5
stimuli:
  - name: basic_queue_service_client
    prompt: |-
      Create a python application which implements a basic example using QueueServiceClient with DefaultAzureCredential.
      Create a queue, list queues, and delete the queue.
      Save the code to `queue_service.py` in the current workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Idiomatic Python quality
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Rubric LLM judge
        weight: 1
        config:
          prompt: |-
            Evaluate the generated answer against the stimulus rubric.
            Use the rubric criteria as the primary judgment basis.
            Score 1 if the answer is missing required code output or is largely non-compliant.
            Score 5 only when the response fully satisfies rubric expectations with correct, executable, idiomatic code.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-storage-queue-py
  - name: queue_client_send_receive_peek
    prompt: |-
      Create a python application which implements a QueueClient that sends a message, receives messages,
      peeks messages, and deletes messages after processing.
      Save the code to `queue_client.py` in the current workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Idiomatic Python quality
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Rubric LLM judge
        weight: 1
        config:
          prompt: |-
            Evaluate the generated answer against the stimulus rubric.
            Use the rubric criteria as the primary judgment basis.
            Score 1 if the answer is missing required code output or is largely non-compliant.
            Score 5 only when the response fully satisfies rubric expectations with correct, executable, idiomatic code.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-storage-queue-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-storage-queue-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
