name: azure-cosmos-py-eval
description: Vally evaluation suite for azure-cosmos-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  grader_model: gpt-5.5
stimuli:
  - name: basic_aad_client
    prompt: |-
      Create a basic Cosmos DB NoSQL example using DefaultAzureCredential.
      Get a database and container, upsert an item, and read it back.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Ensure ALL Python syntax is valid and correct:
        * Use proper bracket matching: {}, [], ()
        * Do not use placeholder variables or template syntax
      - All .py files must pass Python syntax validation: `python -m py_compile <file>`
      - CRITICAL: Include explicit exception handling:
        * Wrap credential acquisition in try/except
        * Wrap client initialization in try/except
        * Wrap all CRUD operations (upsert, read) in try/except blocks
        * Handle specific exceptions: ClientAuthenticationError, CosmosHttpResponseError, exceptions.AzureError
        * Example: try: credential = DefaultAzureCredential() except ClientAuthenticationError as e: handle_auth_error(e)
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          model: claude-sonnet-4.6
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
  - name: connection_string_client
    prompt: |-
      Create a CosmosClient using a connection string and retrieve
      an existing database.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Ensure ALL Python syntax is valid and correct:
        * Use proper bracket matching: {}, [], ()
        * Do not use placeholder variables or template syntax
      - All .py files must pass Python syntax validation: `python -m py_compile <file>`
      - CRITICAL: Include explicit exception handling:
        * Wrap client initialization in try/except
        * Wrap database retrieval in try/except blocks
        * Handle specific exceptions: ClientAuthenticationError, CosmosHttpResponseError, exceptions.AzureError
        * Example: try: client = CosmosClient.from_connection_string(conn) except ClientAuthenticationError as e: handle_auth_error(e)
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          model: claude-sonnet-4.6
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
constraints:
  expect_skills:
    - azure-cosmos-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-cosmos-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
