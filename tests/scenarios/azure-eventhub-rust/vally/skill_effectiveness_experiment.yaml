# Purpose: Measure skill effectiveness by comparing the same stimulus with and without the corresponding skill.
name: azure-eventhub-rust-skill-experiment
evals:
  - eval.yaml

vary:
  - /environment/skills

baseline: baseline

variants:
  skill:
    environment:
      skills:
        - ../../../../.github/plugins/azure-sdk-rust/skills/azure-eventhub-rust
  baseline:
    environment:
      skills: []
