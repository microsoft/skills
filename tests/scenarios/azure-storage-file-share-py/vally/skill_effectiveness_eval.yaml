name: azure-storage-file-share-py-eval
description: Vally evaluation suite for azure-storage-file-share-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  grader_model: gpt-5.5
stimuli:
  - name: service_client_connection_string
    prompt: |-
      Create a ShareServiceClient using a connection string and demonstrate
      creating a share, listing shares, and deleting the share.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Include explicit exception handling:
        * Wrap credential/client initialization and all storage operations in try/except blocks
        * Handle: ResourceNotFoundError, ResourceExistsError, AzureError
        * Example: try: blob_client.upload_blob(data) except ResourceExistsError: pass
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          model: claude-sonnet-4.6
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
  - name: service_client_default_azure_credential
    prompt: |-
      Use DefaultAzureCredential with a ShareServiceClient and account_url.
      Create a share client, create a directory, and clean up the share.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Include explicit exception handling:
        * Wrap credential/client initialization and all storage operations in try/except blocks
        * Handle: ResourceNotFoundError, ResourceExistsError, AzureError
        * Example: try: blob_client.upload_blob(data) except ResourceExistsError: pass
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          model: claude-sonnet-4.6
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
constraints:
  expect_skills:
    - azure-storage-file-share-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-storage-file-share-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
