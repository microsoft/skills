config:
  model: gpt-5.5
  max_tokens: 2000
  temperature: 0.3
scenarios:
- name: basic_client_creation
  prompt: Create a minimal but production-ready Azure App Configuration SDK example
    that authenticates with DefaultAzureCredential, creates AzureAppConfigurationClient
    from AZURE_APPCONFIGURATION_ENDPOINT, retrieves one setting with get_configuration_setting,
    and uses context-manager based cleanup.
  expected_patterns:
  - DefaultAzureCredential
  - AzureAppConfigurationClient
  - get_configuration_setting
  - base_url
  - os.environ["AZURE_APPCONFIGURATION_ENDPOINT"]
  - with AzureAppConfigurationClient
  forbidden_patterns:
  - hardcoded
  - endpoint=
  - from_connection_string
  tags:
  - basic
  - authentication
  mock_response: "import os\nfrom azure.identity import DefaultAzureCredential\nfrom\
    \ azure.appconfiguration import AzureAppConfigurationClient\n\nwith AzureAppConfigurationClient(\n\
    \    base_url=os.environ[\"AZURE_APPCONFIGURATION_ENDPOINT\"],\n    credential=DefaultAzureCredential()\n\
    ) as client:\n    setting = client.get_configuration_setting(key=\"app:message\")\n\
    \    print(f\"{setting.key} = {setting.value}\")"
- name: key_value_settings
  prompt: Demonstrate key-value configuration management with labels for environment
    isolation. Include creating/updating a ConfigurationSetting, retrieving it by key+label,
    listing with key_filter and label_filter, and deleting the same setting.
  expected_patterns:
  - ConfigurationSetting
  - set_configuration_setting
  - get_configuration_setting
  - list_configuration_settings
  - delete_configuration_setting
  - key_filter
  - label_filter
  forbidden_patterns:
  - from_connection_string
  - endpoint=
  tags:
  - key-value
  - settings
  mock_response: "import os\nfrom azure.identity import DefaultAzureCredential\nfrom\
    \ azure.appconfiguration import (\n    AzureAppConfigurationClient,\n    ConfigurationSetting\n\
    )\n\nclient = AzureAppConfigurationClient(\n    base_url=os.environ[\"AZURE_APPCONFIGURATION_ENDPOINT\"\
    ],\n    credential=DefaultAzureCredential()\n)\n\nsetting = ConfigurationSetting(\n\
    \    key=\"app:database:connection\",\n    value=\"Server=localhost;User=admin\"\
    ,\n    label=\"development\",\n    tags={\"environment\": \"dev\"}\n)\nclient.set_configuration_setting(setting)\n\
    \nretrieved = client.get_configuration_setting(\n    key=\"app:database:connection\"\
    ,\n    label=\"development\"\n)\nprint(f\"Retrieved: {retrieved.value}\")\n\n\
    settings = client.list_configuration_settings(\n    key_filter=\"app:database:*\"\
    ,\n    label_filter=\"development\"\n)\nfor setting in settings:\n    print(f\"\
    {setting.key}: {setting.value}\")\n\nclient.delete_configuration_setting(\n  \
    \  key=\"app:database:connection\",\n    label=\"development\"\n)\n\nclient.close()"
- name: feature_flag_usage
  prompt: Demonstrate feature flag management using App Configuration conventions.
    Include writing a feature flag under a .appconfig.featureflag/* key, using the
    required feature-flag content type, reading it back, and checking whether the
    flag is enabled.
  expected_patterns:
  - .appconfig.featureflag
  - json.dumps
  - json.loads
  - application/vnd.microsoft.appconfig.ff
  - '"enabled"'
  - content_type
  forbidden_patterns:
  - application/json
  - "value={"
  tags:
  - feature-flags
  - settings
  mock_response: "import os\nimport json\nfrom azure.identity import DefaultAzureCredential\n\
    from azure.appconfiguration import (\n    AzureAppConfigurationClient,\n    ConfigurationSetting\n\
    )\n\nclient = AzureAppConfigurationClient(\n    base_url=os.environ[\"AZURE_APPCONFIGURATION_ENDPOINT\"\
    ],\n    credential=DefaultAzureCredential()\n)\n\nfeature_flag = ConfigurationSetting(\n\
    \    key=\".appconfig.featureflag/beta-features\",\n    value=json.dumps({\n \
    \       \"id\": \"beta-features\",\n        \"enabled\": True,\n        \"conditions\"\
    : {\n            \"client_filters\": []\n        }\n    }),\n    content_type=\"\
    application/vnd.microsoft.appconfig.ff+json;charset=utf-8\"\n)\nclient.set_configuration_setting(feature_flag)\n\
    \nflag = client.get_configuration_setting(key=\".appconfig.featureflag/beta-features\"\
    )\nflag_data = json.loads(flag.value)\nprint(f\"Feature enabled: {flag_data['enabled']}\"\
    )\n\nclient.close()"
- name: async_client_usage
  prompt: Create an async Azure App Configuration SDK example using azure.appconfiguration.aio
    and azure.identity.aio. Include async/await operations, async context managers for
    credential and client, and at least one await client.get_configuration_setting call.
  expected_patterns:
  - from azure.appconfiguration.aio import AzureAppConfigurationClient
  - from azure.identity.aio import DefaultAzureCredential
  - async with
  - await client.get_configuration_setting
  - AZURE_APPCONFIGURATION_ENDPOINT
  forbidden_patterns:
  - from azure.appconfiguration import AzureAppConfigurationClient
  - from azure.identity import DefaultAzureCredential
  tags:
  - async
  - authentication
  mock_response: "import asyncio\nimport os\nfrom azure.appconfiguration.aio import\
    \ AzureAppConfigurationClient\nfrom azure.identity.aio import DefaultAzureCredential\n\
    \nasync def main():\n    async with AzureAppConfigurationClient(\n        base_url=os.environ[\"\
    AZURE_APPCONFIGURATION_ENDPOINT\"],\n        credential=DefaultAzureCredential()\n\
    \    ) as client:\n        setting = await client.get_configuration_setting(key=\"\
    app:message\")\n        print(f\"{setting.key} = {setting.value}\")\n\nasyncio.run(main())"
- name: read_only_settings
  prompt: Show how to protect production configuration by toggling read-only state.
    Include creating/updating a setting, applying read-only protection via set_read_only,
    and retrieving the setting to verify the read-only state.
  expected_patterns:
  - set_configuration_setting
  - set_read_only
  - read_only=True
  - get_configuration_setting
  forbidden_patterns: []
  tags:
  - production
  - settings
  mock_response: |-
    import os
    from azure.identity import DefaultAzureCredential
    from azure.appconfiguration import (
        AzureAppConfigurationClient,
        ConfigurationSetting,
    )

    client = AzureAppConfigurationClient(
        base_url=os.environ["AZURE_APPCONFIGURATION_ENDPOINT"],
        credential=DefaultAzureCredential(),
    )

    setting = ConfigurationSetting(
        key="app:database:url",
        value="postgres://prod.db",
        label="production",
    )
    setting = client.set_configuration_setting(setting)

    client.set_read_only(
        configuration_setting=setting,
        read_only=True,
    )

    retrieved = client.get_configuration_setting(
        key="app:database:url",
        label="production",
    )
    print(f"Read-only: {retrieved.read_only}")

    client.close()
- name: snapshot_management
  prompt: Demonstrate snapshot workflow for point-in-time configuration capture. Include
    creating a snapshot using ConfigurationSettingFilter criteria, listing or fetching
    snapshot metadata, and reading configuration settings from a snapshot.
  expected_patterns:
  - begin_create_snapshot
  - list_snapshots
  - list_configuration_settings
  - ConfigurationSettingFilter
  - ConfigurationSnapshot
  - snapshot
  forbidden_patterns: []
  tags:
  - snapshot
  - backup
  mock_response: |-
    import os
    from azure.identity import DefaultAzureCredential
    from azure.appconfiguration import (
        AzureAppConfigurationClient,
        ConfigurationSettingFilter,
        ConfigurationSnapshot,
    )

    client = AzureAppConfigurationClient(
        base_url=os.environ["AZURE_APPCONFIGURATION_ENDPOINT"],
        credential=DefaultAzureCredential(),
    )

    snapshot = ConfigurationSnapshot(
        name="v1-backup",
        filters=[ConfigurationSettingFilter(key="app:*", label="production")],
    )

    created = client.begin_create_snapshot(
        name="v1-backup",
        snapshot=snapshot,
    ).result()
    print(f"Snapshot status: {created.status}")

    snapshots = client.list_snapshots()
    for snap in snapshots:
        print(f"Snapshot: {snap.name} ({snap.status})")

    settings = client.list_configuration_settings(snapshot_name="v1-backup")
    for setting in settings:
        print(f"{setting.key} = {setting.value}")

    client.close()
- name: context_manager_pattern
  prompt: Show correct client lifecycle management using a context manager. Use
    AzureAppConfigurationClient in a with block, perform a get_configuration_setting
    operation, and rely on automatic cleanup without explicit close().
  expected_patterns:
  - with AzureAppConfigurationClient
  - as client
  - get_configuration_setting
  forbidden_patterns:
  - client.close()
  tags:
  - cleanup
  - context-manager
  mock_response: "import os\nfrom azure.identity import DefaultAzureCredential\nfrom\
    \ azure.appconfiguration import AzureAppConfigurationClient\n\nwith AzureAppConfigurationClient(\n\
    \    base_url=os.environ[\"AZURE_APPCONFIGURATION_ENDPOINT\"],\n    credential=DefaultAzureCredential()\n\
    ) as client:\n    setting = client.get_configuration_setting(key=\"app:config\"\
    )\n    print(f\"Config: {setting.value}\")"
- name: list_with_filters
  prompt: Demonstrate filtered enumeration of settings using list_configuration_settings
    with both key_filter and label_filter. Include an example for environment-specific
    configuration such as production-labeled keys.
  expected_patterns:
  - list_configuration_settings
  - key_filter
  - label_filter
  - production
  forbidden_patterns:
  - from_connection_string
  tags:
  - filtering
  - list
  - settings
  mock_response: "import os\nfrom azure.identity import DefaultAzureCredential\nfrom\
    \ azure.appconfiguration import AzureAppConfigurationClient\n\nclient = AzureAppConfigurationClient(\n\
    \    base_url=os.environ[\"AZURE_APPCONFIGURATION_ENDPOINT\"],\n    credential=DefaultAzureCredential()\n\
    )\n\nprod_settings = client.list_configuration_settings(\n    key_filter=\"app:*\"\
    ,\n    label_filter=\"production\"\n)\n\nfor setting in prod_settings:\n    print(f\"\
    {setting.key} = {setting.value}\")\n\nclient.close()"
