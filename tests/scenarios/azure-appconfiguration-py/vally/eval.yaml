name: azure-appconfiguration-py-eval
description: Vally evaluation suite for azure-appconfiguration-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  judge_model: gpt-5.5
stimuli:
  - name: core_workflow
    prompt: |-
      Write a complete Python example that demonstrates realistic Azure App Configuration SDK usage with the official `azure-appconfiguration` client patterns.

      The example must include:
      - Client creation with `AzureAppConfigurationClient` using `DefaultAzureCredential` and `AZURE_APPCONFIGURATION_ENDPOINT`
      - Context manager lifecycle management (`with` / `async with`) for deterministic cleanup
      - Key-value CRUD operations using `ConfigurationSetting` (set/get/list/delete)
      - Label-aware retrieval and filtered listing (`key_filter`, `label_filter`)
      - Feature flag handling via `.appconfig.featureflag/*` keys and correct feature flag content type
      - Read-only lock/unlock workflow via `set_read_only`
      - Snapshot usage (`begin_create_snapshot`, `list_snapshots`, or listing settings from a snapshot)
      - Explicit `try/except` error handling with clear messages

      Keep credentials in environment variables only and avoid hardcoded secrets.

      Save the code to a file named `appconfig_core_workflow.py` in the workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Idiomatic Python quality
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Rubric LLM judge
        weight: 1
        config:
          prompt: |-
            Evaluate the generated answer against the stimulus rubric.
            Use the rubric criteria as the primary judgment basis.
            Score 1 if the answer is missing required code output or is largely non-compliant.
            Score 5 only when the response fully satisfies rubric expectations with correct, executable, idiomatic code.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-appconfiguration-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-appconfiguration-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
