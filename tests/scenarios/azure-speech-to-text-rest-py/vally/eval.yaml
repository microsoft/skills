name: azure-speech-to-text-rest-py-eval
description: Vally evaluation suite for azure-speech-to-text-rest-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  judge_model: gpt-5.5
stimuli:
  - name: core_workflow
    prompt: |-
      Write a complete Python example that demonstrates Azure Speech-to-Text REST API usage for short audio transcription.

      The example must include:
      - REST endpoint construction using `AZURE_SPEECH_REGION`, with the short-audio recognition path
        `https://{region}.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1`
      - Authentication via environment variables (`AZURE_SPEECH_KEY` and `AZURE_SPEECH_REGION`) using either:
        - `Ocp-Apim-Subscription-Key`, or
        - STS token flow (`issueToken`) followed by `Authorization: Bearer ...`
      - A `requests.post` call that sends binary audio data from a local file
      - Correct headers for WAV PCM audio (`Content-Type: audio/wav; codecs=audio/pcm; samplerate=16000`)
      - Required query parameter `language` and optional parameters such as `format` (`simple` or `detailed`) and `profanity`
      - Response handling for `RecognitionStatus`, including success and non-success paths
      - Explicit `try/except` handling for HTTP/network and service errors

      Keep credentials in environment variables and avoid hardcoded secrets.

      Save the code to a file named `speech_to_text_core_workflow.py` in the workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-speech-to-text-rest-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-speech-to-text-rest-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"