name: azure-ai-projects-py-eval
description: Vally evaluation suite for azure-ai-projects-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  grader_model: gpt-5.5
stimuli:
  - name: client_creation
    prompt: |-
      Create an AIProjectClient with proper authentication using DefaultAzureCredential.
      Use environment variables for the endpoint and include a context manager pattern.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Include explicit exception handling:
        * Wrap credential/client initialization and all API operations in try/except blocks
        * Handle: AzureError, HttpResponseError, ServiceError, and generic Exception types
        * Example: try: result = client.analyze(...) except HttpResponseError as e: print(f'Error: {e}')
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
  - name: versioned_agent_creation
    prompt: |-
      Create a versioned agent using create_version() with PromptAgentDefinition.
      Include a version label and description. The agent should be named "customer-support-agent".

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Include explicit exception handling:
        * Wrap credential/client initialization and all API operations in try/except blocks
        * Handle: AzureError, HttpResponseError, ServiceError, and generic Exception types
        * Example: try: result = client.analyze(...) except HttpResponseError as e: print(f'Error: {e}')
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
constraints:
  expect_skills:
    - azure-ai-projects-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-ai-projects-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
