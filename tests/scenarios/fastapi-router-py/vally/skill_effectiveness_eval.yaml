name: fastapi-router-py-eval
description: Vally evaluation suite for fastapi-router-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  grader_model: gpt-5.5
stimuli:
  - name: basic_crud_router
    prompt: |-
      Create a FastAPI router for managing "projects" with full CRUD operations.
      Include GET (list and single), POST (create), PATCH (update), and DELETE endpoints.
      Use proper status codes, response models, and async/await patterns.
      Include pagination with limit and offset query parameters.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Use ONLY concrete resource names. Substitute all placeholders:
        * Use "project" (snake_case), "Project" (PascalCase), "projects" (plural)
        * NEVER use {{variable}}, {{resource_name}}, {{ResourceName}}, or {{resource_plural}}
      - All .py files must pass Python syntax validation: `python -m py_compile <file>`
      - Do NOT reference, import, or copy from template.py files
      - CRITICAL: Include explicit exception handling:
        * Wrap async endpoint logic in try/except blocks
        * Handle HTTPException, ValueError, and generic Exception types
        * Provide meaningful error messages in responses
        * Example: try: ... except ValueError as e: raise HTTPException(status_code=400, detail=str(e))
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
            - .vally/syntax-check-config.json
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          model: claude-sonnet-4.6
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
  - name: router_with_authentication
    prompt: |-
      Create a FastAPI router for "tasks" where:
      - GET endpoints (list, single) allow optional authentication
      - POST, PATCH, DELETE endpoints require authentication
      - Use get_current_user for optional and get_current_user_required for required auth
      Include proper type hints and HTTPException for unauthorized access.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Use ONLY concrete resource names. Substitute all placeholders:
        * Use "task" (snake_case), "Task" (PascalCase), "tasks" (plural)
        * NEVER use {{variable}}, {{resource_name}}, {{ResourceName}}, or {{resource_plural}}
      - All .py files must pass Python syntax validation: `python -m py_compile <file>`
      - Do NOT reference, import, or copy from template.py files
      - CRITICAL: Include explicit exception handling:
        * Wrap async endpoint logic in try/except blocks
        * Handle HTTPException, ValueError, and generic Exception types
        * Provide meaningful error messages in responses
        * Example: try: ... except ValueError as e: raise HTTPException(status_code=400, detail=str(e))
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
            - .vally/syntax-check-config.json
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          model: claude-sonnet-4.6
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
constraints:
  expect_skills:
    - fastapi-router-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/fastapi-router-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
    - src: ./syntax-check-config.json
      dest: .vally/syntax-check-config.json
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"
