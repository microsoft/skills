name: azure-monitor-ingestion-py-eval
description: Vally evaluation suite for azure-monitor-ingestion-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  judge_model: gpt-5.5
stimuli:
  - name: sync_basic_upload
    prompt: |-
      Provide a minimal synchronous example that uploads custom logs.
      Use DefaultAzureCredential, a DCE endpoint from AZURE_DCE_ENDPOINT,
      and DCR rule/stream names from AZURE_DCR_RULE_ID and AZURE_DCR_STREAM_NAME.
      Save the code to a file named `sync_basic_upload.py` in the workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Idiomatic Python quality
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Rubric LLM judge
        weight: 1
        config:
          prompt: |-
            Evaluate the generated answer against the stimulus rubric.
            Use the rubric criteria as the primary judgment basis.
            Score 1 if the answer is missing required code output or is largely non-compliant.
            Score 5 only when the response fully satisfies rubric expectations with correct, executable, idiomatic code.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-monitor-ingestion-py
  - name: async_upload_with_context_manager
    prompt: |-
      Provide an async example using azure.monitor.ingestion.aio LogsIngestionClient.
      Use async with and await upload.
      Save the code to a file named `async_upload_with_context_manager.py` in the workspace.
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Idiomatic Python quality
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Rubric LLM judge
        weight: 1
        config:
          prompt: |-
            Evaluate the generated answer against the stimulus rubric.
            Use the rubric criteria as the primary judgment basis.
            Score 1 if the answer is missing required code output or is largely non-compliant.
            Score 5 only when the response fully satisfies rubric expectations with correct, executable, idiomatic code.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-monitor-ingestion-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-monitor-ingestion-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"

