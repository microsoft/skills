name: azure-messaging-webpubsubservice-py-eval
description: Vally evaluation suite for azure-messaging-webpubsubservice-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  judge_model: gpt-5.5
stimuli:
  - name: connection_string_broadcast
    prompt: |-
      Write a Python application which shows how to create a WebPubSubServiceClient using a connection string from environment
      variables, then send a text and JSON message to all connections.
      Save the code to a file named `connection_string_broadcast.py` in the workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-messaging-webpubsubservice-py
  - name: default_credential_targeted_sends
    prompt: |-
      Write a Python application which shows how to use DefaultAzureCredential with endpoint and hub from environment variables,
      then send a message to a user and to a group.
      Save the code to a file named `default_credential_targeted_sends.py` in the workspace.

    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5

    constraints:
      expect_skills:
        - azure-messaging-webpubsubservice-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/azure-messaging-webpubsubservice-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"