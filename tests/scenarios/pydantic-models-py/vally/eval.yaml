name: pydantic-models-py-eval
description: Vally evaluation suite for pydantic-models-py
version: "1.0"
type: capability
scoring:
  weights: {}
  threshold: 0.75
defaults:
  runs: 1
  timeout: 30m
  model: claude-sonnet-4.6
  grader_model: gpt-5.5
stimuli:
  - name: base_create_response_indb
    prompt: |-
      Create a complete set of Pydantic models for a "Document" resource following the 
      multi-model pattern. Include Base, Create, Update, Response, and InDB models.
      Use Field constraints, proper inheritance, and camelCase aliases with populate_by_name.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Use ONLY concrete resource names. Substitute all placeholders:
        * Use "Document" (PascalCase), "document" (snake_case)
        * NEVER use {{variable}}, {{ResourceName}}, {{resource_name}}, or similar placeholders
      - All .py files must pass Python syntax validation: `python -m py_compile <file>`
      - Do NOT reference, import, or copy from template.py files
      - CRITICAL: Include explicit exception handling in any code that instantiates or validates models:
        * Wrap model instantiation in try/except blocks
        * Handle ValidationError from pydantic
        * Example: try: Document(...) except ValidationError as e: handle_validation_error(e)
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
            - .vally/syntax-check-config.json
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
  - name: camel_case_aliases
    prompt: |-
      Create a Pydantic model for a "Project" resource with snake_case fields but camelCase 
      aliases for API responses. Include created_at and updated_at with aliases.
      Ensure populate_by_name is True to accept both formats.

      Output requirements for grading:
      - Generate Python code, not prose.
      - Create at least one runnable Python file in the workspace (for example, `main.py`).
      - Return the final answer as Python code only.
      - CRITICAL: Use ONLY concrete resource names. Substitute all placeholders:
        * Use "Project" (PascalCase), "project" (snake_case)
        * NEVER use {{variable}}, {{ResourceName}}, {{resource_name}}, or similar placeholders
      - All .py files must pass Python syntax validation: `python -m py_compile <file>`
      - Do NOT reference, import, or copy from template.py files
      - CRITICAL: Include explicit exception handling in any code that instantiates or validates models:
        * Wrap model instantiation in try/except blocks
        * Handle ValidationError from pydantic
        * Example: try: Project(...) except ValidationError as e: handle_validation_error(e)
    rubric:
      - Uses the APIs, imports, and workflow expected by the skill.
      - Keeps credentials in environment variables and avoids hardcoded secrets.
      - Provides complete executable Python code with clear control flow and error handling.
      - Includes explicit try/except exception handling.
      - Uses modern Python conventions and readable structure.
    graders:
      - type: run-command
        name: Python syntax check
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-syntax.mjs
            - .vally/syntax-check-config.json
          timeout: 90s
      - type: run-command
        name: Python idiomatic static checks
        weight: 1
        config:
          command: node
          args:
            - .vally/tools/check-python-idiomatic.mjs
          timeout: 90s
      - type: prompt
        name: Idiomatic Python quality
        weight: 1
        config:
          prompt: |-
            Evaluate whether the generated Python code is idiomatic.
            Pass only when the code uses Pythonic naming, clear control flow,
            explicit exception handling (no bare except), avoids wildcard imports,
            and uses context managers or lifecycle-safe patterns where relevant.
            Fail immediately if no Python code is generated.
            Treat missing code as an automatic failure when there is no `.py` file in the workspace
            and no substantive Python code in the assistant output.
          scoring: scale_1_5
constraints:
  expect_skills:
    - pydantic-models-py
environment:
  skills:
    - ../../../../.github/plugins/azure-sdk-python/skills/pydantic-models-py
  files:
    - src: ../../_shared/vally/tools/check-python-syntax.mjs
      dest: .vally/tools/check-python-syntax.mjs
    - src: ../../_shared/vally/tools/check-python-idiomatic.mjs
      dest: .vally/tools/check-python-idiomatic.mjs
    - src: ./syntax-check-config.json
      dest: .vally/syntax-check-config.json
artifacts:
  include:
    - "**/*.py"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/README.md"
  exclude:
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/.mypy_cache/**"
    - "**/.pytest_cache/**"

